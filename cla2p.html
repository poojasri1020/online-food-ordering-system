<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress - Online Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --accent: #ff6b81;
        }
        .navbar-brand { color: var(--primary) !important; font-weight: bold; }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                        url('https://source.unsplash.com/1600x900/?restaurant,food');
            background-size: cover;
            color: white;
            padding: 100px 0;
            text-align: center;
        }
        .card { transition: transform 0.3s; margin-bottom: 20px; }
        .card:hover { transform: translateY(-5px); }
        .food-img { height: 200px; object-fit: cover; }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            padding: 4px 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            border: none;
        }
        .btn-primary:hover { background-color: var(--accent); }
        footer { background-color: var(--secondary); color: white; padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">🍽️ FoodExpress</a>
            <div class="d-flex align-items-center">
                <a class="nav-link position-relative me-3" href="#cart">
                    🛒 <span class="cart-badge" id="cartCount">0</span>
                </a>
                <button class="btn btn-primary">Login</button>
            </div>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container">
            <h1>Delicious Food Delivered</h1>
            <div class="col-md-6 mx-auto mt-4">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search food...">
                    <button class="btn btn-primary">Search</button>
                </div>
            </div>
        </div>
    </section>

    <section class="container py-5">
        <h2>Popular Restaurants</h2>
        <div class="row" id="restaurantList"></div>
    </section>

    <section class="container py-5">
        <h2>Trending Dishes</h2>
        <div class="row" id="menuList"></div>
    </section>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>Contact</h5>
                    <p>📞 +1 234 567 890</p>
                    <p>📧 help@foodexpress.com</p>
                </div>
                <div class="col-md-4">
                    <h5>Quick Links</h5>
                    <p><a href="#" class="text-white">About Us</a></p>
                    <p><a href="#" class="text-white">Terms</a></p>
                </div>
                <div class="col-md-4">
                    <h5>Download App</h5>
                    <button class="btn btn-light mb-2">App Store</button>
                    <button class="btn btn-light">Play Store</button>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const restaurants = [
            { name: "Pizza Palace", rating: 4.5, time: "30-40", image: "https://imgs.search.brave.com/8KSOwJUW0xPtyGboujoZ7WRGqyCZEbBReMmOsLpZUdI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5nZXR0eWltYWdl/cy5jb20vaWQvMTg0/OTQ2NzAxL3Bob3Rv/L3BpenphLmpwZz9z/PTYxMng2MTImdz0w/Jms9MjAmYz05N3Jj/MFZJaS1zM21uNHhl/NHhEeTlTLVhKX09o/Ym45MlhhRU1haUlE/X2VZPQ" },
            { name: "Burger Hub", rating: 4.3, time: "20-30", image: "https://imgs.search.brave.com/bvbw9kLPLlrcYgWOUiQsxIvhTfPGKNMyz6PU58CO7JQ/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5nZXR0eWltYWdl/cy5jb20vaWQvNjQz/ODIxMjgxL3Bob3Rv/L3BsYXRlLW9mLWJ1/cmdlci1hbmQtZnJp/ZXMuanBnP3M9NjEy/eDYxMiZ3PTAmaz0y/MCZjPUwyRkpGbm90/Sm9TZ0Frc1FjV0tf/N3R2ZlkzOFoxTkZl/VDBkODN5QzZkSU09" },
            { name: "Sushi Master", rating: 4.8, time: "25-35", image: "https://imgs.search.brave.com/ne4iq-Z--k4KQXjuCkBGR6hZIIA72P7Dpxv5-YNRtD4/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5nZXR0eWltYWdl/cy5jb20vaWQvMTc5/MDgxNDgxNi9waG90/by9mcmVzaC1nb3Vy/bWV0LXN1c2hpLW9t/YWthc2UtcmVzdGF1/cmFudC5qcGc_cz02/MTJ4NjEyJnc9MCZr/PTIwJmM9aVVMU2xL/bS0yQW9qZTNUSEsw/T01XYXNuSTdsQW5q/VWNkYUppRzBUOEdD/MD0" }
        ];

        const dishes = [
            { name: "Pepperoni Pizza", price: 12.99, restaurant: "Pizza Palace", image: "https://imgs.search.brave.com/qiqXsq-xUpbvPXmK-6os3x4UjEmJI5oIJvk3fKkRGUI/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90NC5m/dGNkbi5uZXQvanBn/LzAyLzE2LzY4LzQx/LzM2MF9GXzIxNjY4/NDE4NV9Ub0ZGdUxu/ZnVmMHZBV1Aweklh/c1JXVUtkRUtqblNW/Ni5qcGc" },
            { name: "Classic Burger", price: 8.99, restaurant: "Burger Hub", image: "https://imgs.search.brave.com/ZMPvr-hIHxMTX3jZEsbSeSzZUK3f0wacrtS8rufn_qE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90My5m/dGNkbi5uZXQvanBn/LzAwLzk0LzkyLzEw/LzM2MF9GXzk0OTIx/MDUzX0xjMDZ1YWJo/TnRNTlNLcTZINWdC/aFpWRG9JNm5LalhX/LmpwZw" },
            { name: "California Roll", price: 14.99, restaurant: "Sushi Master", image: "https://imgs.search.brave.com/1eAuYwQSaLBGu29dbu6wH6pItHOEiEQkdo7N_AYgfHw/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvMTE4/ODM5ODM2L3Bob3Rv/L3N1c2hpLXBsYXRl/LmpwZz9zPTYxMng2/MTImdz0wJms9MjAm/Yz1iSFgyS0ViUlJ0/ckdOZFB5ckhMVzEy/SVNZSWxXRVVrcmdG/TnRETkRyUjJBPQ" }
        ];

        let cart = [];

        function displayRestaurants() {
            const list = document.getElementById('restaurantList');
            restaurants.forEach(r => {
                list.innerHTML += `
                    <div class="col-md-4">
                        <div class="card">
                            <img src="${r.image}" class="food-img card-img-top" alt="${r.name}">
                            <div class="card-body">
                                <h5>${r.name}</h5>
                                <div class="d-flex justify-content-between">
                                    <span>⭐ ${r.rating}</span>
                                    <span>🕒 ${r.time} min</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function displayMenu() {
            const list = document.getElementById('menuList');
            dishes.forEach(d => {
                list.innerHTML += `
                    <div class="col-md-4">
                        <div class="card">
                            <img src="${d.image}" class="food-img card-img-top" alt="${d.name}">
                            <div class="card-body">
                                <h5>${d.name}</h5>
                                <p class="text-muted">${d.restaurant}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <h6>$${d.price}</h6>
                                    <button class="btn btn-primary" onclick="addToCart('${d.name}', ${d.price})">
                                        Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cartCount').textContent = cart.length;
            showToast(`${name} added to cart!`);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'position-fixed bottom-0 end-0 p-3';
            toast.innerHTML = `
                <div class="toast show bg-success text-white">
                    <div class="toast-body">✅ ${message}</div>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        displayRestaurants();
        displayMenu();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
